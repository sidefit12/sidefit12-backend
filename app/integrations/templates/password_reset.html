<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <title>SideFit 비밀번호 재설정</title>
</head>
<body style="margin:0;padding:0;background:#f7f7f7;color:#111;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;word-break:keep-all;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">SideFit 비밀번호 재설정 안내입니다.</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#f7f7f7;">
        <tr><td align="center" style="padding:48px 16px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#fff;border:1px solid #e5e5e5;border-radius:16px;overflow:hidden;">
                <tr><td style="padding:22px 40px;border-bottom:1px solid #e5e5e5;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
                        <td><img src="cid:sidefit-logo.png" alt="SideFit" width="104" style="display:block;width:104px;height:auto;border:0;"></td>
                        <td align="right" style="font-size:10px;font-weight:700;letter-spacing:1.2px;color:#111;">SIDEFIT SECURITY</td>
                    </tr></table>
                </td></tr>
                <tr><td style="padding:38px 40px 40px;background:#111;">
                    <p style="margin:0 0 20px;font-size:11px;font-weight:700;letter-spacing:1.4px;color:#d8ff00;">RESET YOUR PASSWORD</p>
                    <h1 style="margin:0 0 20px;font-size:36px;line-height:1.35;letter-spacing:-1.4px;color:#fff;">비밀번호를<br>재설정해 주세요.</h1>
                    <p style="margin:0;font-size:14px;line-height:1.7;color:#c1c1c1;">아래 버튼을 누르면 SideFit 비밀번호를<br>새로 설정할 수 있습니다.</p>
                </td></tr>
                <tr><td style="padding:34px 40px 36px;background:#fff;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
                        <td align="center" style="background:#d8ff00;border-radius:12px;">
                            <a href="{{ reset_url }}" style="display:block;padding:20px 24px;font-size:15px;font-weight:700;color:#111;text-decoration:none;">비밀번호 재설정하기</a>
                        </td>
                    </tr></table>
                    <p style="margin:24px 0 0;font-size:12px;line-height:1.8;color:#757575;">이 링크는 발급 후 <strong style="color:#111;">{{ expires_in_minutes }}분 동안</strong> 유효합니다.<br>본인이 요청하지 않았다면 이 메일을 무시해 주세요.</p>
                </td></tr>
                <tr><td style="padding:22px 40px;background:#111;color:#8d8d8d;font-size:11px;">© {{ current_year }} SIDEFIT</td></tr>
            </table>
        </td></tr>
    </table>
</body>
</html>
