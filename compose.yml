services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sidefit-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sidefit
      POSTGRES_USER: sidefit
      POSTGRES_PASSWORD: sidefit1234
      TZ: Asia/Seoul

    ports:
      - "5432:5432"

    volumes:
      - sidefit-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidefit -d sidefit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sidefit-postgres-data: