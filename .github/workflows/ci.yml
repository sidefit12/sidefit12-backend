name: 백엔드 테스트 및 코드 품질 검사

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 백엔드 검사 및 테스트 실행
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 테스트 환경 변수 파일 생성
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          if [ -z "$BACKEND_ENV_FILE" ]; then
            echo "BACKEND_ENV_FILE GitHub Actions Secret이 설정되지 않았습니다."
            exit 1
          fi
          umask 077
          printf '%s' "$BACKEND_ENV_FILE" > .env

      - name: Python 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 의존성 무결성 검사
        run: python -m pip check

      - name: Ruff 정적 검사
        run: python -m ruff check app tests

      - name: Ruff 코드 포맷 검사
        run: python -m ruff format --check app tests

      - name: Python 코드 컴파일 검사
        run: python -m compileall -q app tests

      - name: 인증 API 테스트 실행
        run: python -m pytest -q
